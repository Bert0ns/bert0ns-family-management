      <script>
        (function () {
          const input = document.getElementById('amount-input');
          const resetBtn = document.getElementById('reset-btn');
          const quickChips = document.querySelectorAll('.quick-chip');
          const categoryBtns = document.querySelectorAll('.category-btn');
          const dateBtns = document.querySelectorAll('.date-btn');
          const payerBtns = document.querySelectorAll('.payer-btn');
          const detailsToggle = document.getElementById('details-toggle');
          const detailsPanel = document.getElementById('details-panel');
          const detailsChevron = document.getElementById('details-chevron');
          const splitBtns = document.querySelectorAll('.split-btn');

          let currentVal = 0;

          function formatVal(v) {
            return v.toFixed(2).replace('.', ',');
          }

          quickChips.forEach((btn) => {
            btn.addEventListener('click', () => {
              const add = parseFloat(btn.getAttribute('data-val')) || 0;
              currentVal += add;
              input.value = formatVal(currentVal);
            });
          });

          input.addEventListener('input', (e) => {
            const parsed = parseFloat(e.target.value.replace(',', '.')) || 0;
            currentVal = parsed;
          });

          resetBtn.addEventListener('click', () => {
            currentVal = 0;
            input.value = '0,00';
          });

          categoryBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
              categoryBtns.forEach((b) => {
                b.className =
                  'category-btn h-[72px] rounded-xl p-space-sm flex items-center justify-between bg-surface-container text-on-surface shadow-sm active:scale-95 transition-transform duration-150';
                const iconBox = b.querySelector('div > div');
                iconBox.className =
                  'w-11 h-11 rounded-lg bg-surface-container-highest flex items-center justify-center flex-shrink-0';
                const check = b.querySelector('.check-indicator');
                check.classList.add('hidden');
              });
              btn.className =
                'category-btn h-[72px] rounded-xl p-space-sm flex items-center justify-between bg-primary text-on-primary shadow-sm active:scale-95 transition-transform duration-150';
              const activeIconBox = btn.querySelector('div > div');
              activeIconBox.className =
                'w-11 h-11 rounded-lg bg-on-primary/10 flex items-center justify-center flex-shrink-0';
              const activeCheck = btn.querySelector('.check-indicator');
              activeCheck.classList.remove('hidden');
            });
          });

          dateBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
              dateBtns.forEach((b) => {
                b.className =
                  'date-btn h-14 rounded-xl font-label-md text-label-md bg-surface-container text-on-surface flex items-center justify-center gap-space-xs active:scale-95 transition-transform duration-150';
              });
              btn.className =
                'date-btn h-14 rounded-xl font-label-md text-label-md bg-primary text-on-primary flex items-center justify-center gap-space-xs active:scale-95 transition-transform duration-150';
            });
          });

          payerBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
              payerBtns.forEach((b) => {
                b.className =
                  'payer-btn h-16 rounded-xl p-space-xs flex items-center justify-between bg-surface-container text-on-surface shadow-sm active:scale-95 transition-transform duration-150';
                const avatar = b.querySelector('div > div');
                avatar.className =
                  'w-10 h-10 rounded-full bg-surface-container-highest text-on-surface flex items-center justify-center font-label-md text-label-md flex-shrink-0';
                const check = b.querySelector('.payer-check');
                check.classList.add('hidden');
              });
              btn.className =
                'payer-btn h-16 rounded-xl p-space-xs flex items-center justify-between bg-secondary-container text-on-secondary-container shadow-sm active:scale-95 transition-transform duration-150';
              const activeAvatar = btn.querySelector('div > div');
              activeAvatar.className =
                'w-10 h-10 rounded-full bg-secondary text-on-secondary flex items-center justify-center font-label-md text-label-md flex-shrink-0';
              const activeCheck = btn.querySelector('.payer-check');
              activeCheck.classList.remove('hidden');
            });
          });

          detailsToggle.addEventListener('click', () => {
            const isExpanded = !detailsPanel.classList.contains('hidden');
            if (isExpanded) {
              detailsPanel.classList.add('hidden');
              detailsChevron.style.transform = 'rotate(0deg)';
            } else {
              detailsPanel.classList.remove('hidden');
              detailsChevron.style.transform = 'rotate(180deg)';
            }
          });

          splitBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
              splitBtns.forEach((b) => {
                b.className =
                  'split-btn h-14 rounded-xl font-label-md text-label-md bg-surface-container text-on-surface flex items-center justify-center active:scale-95 transition-transform duration-150';
              });
              btn.className =
                'split-btn h-14 rounded-xl font-label-md text-label-md bg-primary text-on-primary flex items-center justify-center active:scale-95 transition-transform duration-150';
            });
          });
        })();
      </script>
    </main>
  </body>
</html>
