name: Build Android APK (GitHub Actions Native)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Android build
        uses: ./.github/actions/android-prebuild
        with:
          supabase-url: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Android APK with Gradle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --build-cache --parallel
          else
            ./gradlew assembleRelease --build-cache --parallel
          fi

      - name: Locate Output APK
        id: apk-path
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "name=FamilyExpenseManager-debug" >> $GITHUB_OUTPUT
          else
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "name=FamilyExpenseManager-release" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk-path.outputs.name }}
          path: ${{ steps.apk-path.outputs.path }}
          retention-days: 30
