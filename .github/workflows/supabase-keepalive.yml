name: Supabase Free Tier Keepalive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC to prevent the 7-day inactivity pause
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -f -H "apikey: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}/rest/v1/families?select=id&limit=1" > /dev/null
          echo "Supabase database ping successful."
