name: Prepare Android build
description: Install the JS, Java and Android toolchains, generate the native Android project and set up Gradle.
inputs:
  supabase-url:
    description: Value for EXPO_PUBLIC_SUPABASE_URL
    required: false
    default: ''
  supabase-anon-key:
    description: Value for EXPO_PUBLIC_SUPABASE_ANON_KEY
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup JS toolchain
      uses: ./.github/actions/setup-js

    - name: Expo Prebuild (Generate Native Android Project)
      shell: bash
      env:
        EXPO_PUBLIC_SUPABASE_URL: ${{ inputs.supabase-url }}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}
      run: |
        npx expo prebuild --platform android --no-install
        cat << 'PROPS' >> android/gradle.properties
        org.gradle.parallel=true
        org.gradle.caching=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
        org.gradle.vfs.watch=true
        PROPS
        chmod +x android/gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        build-root-directory: android
        cache-read-only: false
