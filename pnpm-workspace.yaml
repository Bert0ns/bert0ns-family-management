allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-notifications@57.0.20
  - expo-router@57.0.22
  - expo-sharing@57.0.21
peerDependencyRules:
  ignoreMissing:
    - react-native-worklets
    - '@react-native/metro-config'
    - '@types/react'
