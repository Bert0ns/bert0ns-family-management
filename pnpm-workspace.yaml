allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26 || 57.0.31'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24 || 57.0.30
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19 || 57.0.25'
  - expo-notifications@57.0.20
  - expo-router@57.0.22 || 57.0.28
  - expo-sharing@57.0.21
  - '@expo/router-server@57.0.13'
  - babel-preset-expo@57.0.16
peerDependencyRules:
  ignoreMissing:
    - react-native-worklets
    - '@react-native/metro-config'
    - '@types/react'
